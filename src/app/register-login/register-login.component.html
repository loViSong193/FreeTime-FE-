<form nz-form [formGroup]="validateForm" class="login-form" (ngSubmit)="submitForm()">
      <h2 style="text-align: center; margin-bottom: 24px;">{{ isLogin ? 'Đăng Nhập' : 'Đăng Ký' }}</h2>
      <nz-form-item>
        <nz-form-control nzErrorTip="Please input your email!">
          <nz-input-group nzPrefixIcon="user">
            <input type="text" nz-input formControlName="email" placeholder="Email" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-control nzErrorTip="Please input your Password!">
          <nz-input-group nzPrefixIcon="lock">
            <input type="password" nz-input formControlName="password" placeholder="Password" />
          </nz-input-group>
        </nz-form-control>
      </nz-form-item>
      <div nz-row class="login-form-margin" *ngIf="isLogin" style="margin-bottom: 10px;">
        <div nz-col [nzSpan]="12">
          <label nz-checkbox formControlName="remember">
            <span>Remember me</span>
          </label>
        </div>
        <div nz-col [nzSpan]="12">
          <a class="login-form-forgot" style="display: flex; justify-content: flex-end;">Forgot password</a>
        </div>
      </div>
      <button nz-button class="login-form-button login-form-margin" nzType="primary" nzBlock>
        {{ isLogin ? 'Log in' : 'Register' }}
      </button>
      <div style="text-align: center; margin-top: 16px;">
        {{ isLogin ? 'Or' : 'Already have an account?' }}
        <a (click)="toggleMode()">{{ isLogin ? 'register now!' : 'login now!' }}</a>
      </div>
    </form>
